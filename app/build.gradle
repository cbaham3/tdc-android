plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version comes from the GitHub workflow (-PversionName=1.0.0 -PversionCode=<run number>).
def appVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
// Upload key: the workflow writes it from the TDC_KEYSTORE_B64 secret.
def keystorePath = System.getenv('TDC_KEYSTORE_PATH')

android {
    namespace 'com.ckbdevs.tdc'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ckbdevs.tdc'
        minSdk 29          // Android 10 and newer
        targetSdk 36       // what Google Play requires for new apps (2026)
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TDC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TDC_KEY_ALIAS')
                keyPassword System.getenv('TDC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
